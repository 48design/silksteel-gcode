name: G-code regression tests

# Manual only. Prevent automatic GitHub Actions minutes usage and email spam.
on:
  workflow_dispatch:

jobs:
  gcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install numpy
      - name: Compile and run regression tests
        run: |
          python -m py_compile SilkSteel.py silksteel_preview.py silksteel_preview_surface.py silksteel_preview_ideal.py silksteel_preview_arcs.py
          python -m unittest discover -s tests -v
      - name: Run preview JavaScript regression tests
        run: node tests/preview_modules.test.mjs
